    body {
      font-family: "monospace-821", sans-serif;
      background-color: <!-- %bgcolor% -->;
      margin: 0;
      padding: 0;
    }

    /* ---- one box language: shared metrics for every boxed cell ---- */
    :root {
      --din: 0.35mm solid black;   /* DIN 15 line weight, used everywhere */
      --cell-pad: 0.6mm 1.5mm;
      --fs: 2.4mm;                  /* body text in boxes */
    }

    /* Sheet frame: diagram (left) + right pane (info blocks + revision/title block) */
    /* outer sheet: trim line + a margin band that holds the zone-reference labels */
    #frame {
      position: relative;
      box-sizing: border-box;
      margin: 0 auto;
      display: grid;                 /* 6mm zone-margin tracks around the drawing */
      grid-template-columns: 6mm 1fr 6mm;
      grid-template-rows: 6mm 1fr 6mm;
      border: 0.18mm solid black;    /* outer trim line */
      container-type: size;          /* lets the DRAFT watermark scale to the sheet (cqw) */
      overflow: hidden;
      background: #fff;
    }
    /* inner drawing frame: the actual content (diagram + right pane) */
    #drawingframe {
      grid-row: 2;
      grid-column: 2;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 95mm;
      border: var(--din);
      overflow: hidden;
    }
    /* zone-reference frame — number/letter strips placed in the frame's margin cells.
       Each strip is an even grid; cell borders draw the boundary ticks. */
    .zrow, .zcol { display: grid; overflow: hidden; position: relative; z-index: 5; }
    .zrow { grid-column: 2; grid-template-rows: 1fr; }     /* one row; columns come from engine */
    .zrow.top { grid-row: 1; }
    .zrow.bot { grid-row: 3; }
    .zcol { grid-row: 2; grid-template-columns: 1fr; }     /* one column; rows from engine -> letters stack */
    .zcol.left  { grid-column: 1; }
    .zcol.right { grid-column: 3; }
    .zrow span, .zcol span {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8mm;
      line-height: 1;
    }
    .zrow span { border-right: 0.18mm solid #000; }
    .zrow span:last-child { border-right: 0; }
    .zcol span { border-bottom: 0.18mm solid #000; }
    .zcol span:last-child { border-bottom: 0; }

    /* Paper sizes (landscape default; .portrait swaps) */

    .A4.portrait { width: 210mm; height: 297mm; }

    .legal.portrait   { width: 215.9mm; height: 355.6mm; }

    /* ---- Zone 1: diagram ---- */
    #diagram {
      grid-column: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3mm;
      box-sizing: border-box;
    }
    #diagram svg, #diagram img { max-width: 100%; max-height: 100%; }
    #description, #notes { display: none; }

    /* ---- Zone 2: right pane — ONE continuous bordered column, no gaps ----
       Left edge = #rightpane border-left; right/top/bottom = the #drawingframe
       border. Every section carries INTERNAL dividers only, so nothing doubles
       against the frame and the blocks read as one tied-together strip. */
    #rightpane {
      grid-column: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-left: var(--din);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* shared box cell — used by the title-block grids */
    .box .c {
      border-right: var(--din);
      border-bottom: var(--din);
      padding: var(--cell-pad);
      font-size: var(--fs);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }
    .box .c.wrap { white-space: normal; }
    .box .c.b { font-weight: bold; }          /* header / emphasis */
    .box .c.ctr { justify-content: center; text-align: center; }

    /* info blocks (top of the right pane) */
    #infoblocks .ib-h {                        /* block heading — bold, centered */
      border-bottom: var(--din);
      text-align: center;
      font-weight: bold;
      font-size: var(--fs);
      padding: 0.7mm 0;
    }
    #infoblocks .ib-t { width: 100%; border-collapse: collapse; }
    #infoblocks .ib-t td {
      border-right: var(--din);
      border-bottom: var(--din);
      font-size: var(--fs);
      padding: var(--cell-pad);
      text-align: left;
    }
    #infoblocks .ib-t td:last-child { border-right: 0; }   /* frame supplies right edge */
    #infoblocks .ib-t td:first-child { width: 16mm; font-weight: bold; }

    /* label boxes — draw each label to-shape: the border is the label outline,
       the stacked lines are its printed content layout. */
    #infoblocks .ib-labels { display: flex; flex-wrap: wrap; gap: 2mm; padding: 2mm; }
    #infoblocks .lbl {
      border: 0.35mm solid #000; padding: 1mm 2.5mm; text-align: center;
      min-width: 16mm; display: flex; flex-direction: column; justify-content: center;
    }
    #infoblocks .lbl-l { font-size: var(--fs); line-height: 1.35; white-space: nowrap; font-weight: bold; }

    /* flexible reserved band — fills the void so the pane is one unbroken frame */
    #rpfill { flex: 1 1 auto; min-height: 0; border-bottom: var(--din); }

    /* revision history + title block (bottom of the right pane) */
    #titleblock { display: flex; flex-direction: column; }
    .revblock {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content max-content;
      grid-auto-rows: minmax(4.25mm, auto);
    }
    .revblock .c:nth-child(4n) { border-right: 0; }        /* last column -> frame edge */
    .idblock { display: grid; grid-template-columns: repeat(6, 1fr); }
    .idblock .c { border-right: 0; }                                                /* default right edge = frame */
    .idblock .company, .idblock .pn, .idblock .size, .idblock .sheet { border-right: var(--din); } /* internal dividers */
    .idblock .title   { grid-column: 1 / -1; font-size: 3.2mm; font-weight: bold; white-space: normal; padding: 1mm; }
    .idblock .company { grid-column: 1 / 3; padding: 0.8mm 1.5mm; }                  /* logo | PN | REV row */
    .company-logo     { display: block; width: auto; height: auto; max-height: 3mm; max-width: 92%; }
    .idblock .pn      { grid-column: 3 / 5; }
    .idblock .rev     { grid-column: 5 / 7; }
    .idblock .company, .idblock .pn, .idblock .rev { font-size: 2.8mm; font-weight: bold; }
    .idblock .size    { grid-column: 1 / 3; }                                        /* SIZE | SHEET | BUILD row */
    .idblock .sheet   { grid-column: 3 / 5; }
    .idblock .build   { grid-column: 5 / 7; padding: 0.6mm 1mm; }   /* hashes at the SIZE/SHEET font */
    .idblock .build .pw { color: #9a9a9a; }   /* separator recedes */
    .idblock .build .ph { color: #555; }      /* commit hashes */
    .idblock .size, .idblock .sheet, .idblock .build { border-bottom: 0; }   /* title-block edge; the footer's top rule closes it */
    /* drawing footer — below the title block in the right pane: proprietary note
       (wraps to fill the column) above the build-provenance stamp (hashes carry ink) */
    #buildfooter { border-top: var(--din); padding: 0.8mm 1.5mm; font-size: 2.1mm; }
    #buildfooter .fnote { display: block; color: #555; letter-spacing: 0.02em; }   /* proprietary note, wraps */

    /* ---- DRAFT watermark (shown only when metadata `draft` is set) ---- */
    #draft {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      pointer-events: none; overflow: hidden; z-index: 40;
    }
    #frame[data-draft="True"] #draft { display: flex; }
    #draft span {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 95mm;    /* fallback if container-query units unsupported */
      font-size: 22cqw;   /* scales to the sheet width */
      letter-spacing: 0.08em;
      color: rgba(208, 38, 38, 0.16);
      transform: rotate(-30deg);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ---- on screen: float the sheet on a backdrop and scale it to fit ---- */
    @media screen {
      /* `safe center`: center while it fits, but fall back to start-alignment when the
         sheet is bigger than the viewport (e.g. zoomed in) so the left edge stays
         reachable — plain `center` traps the left overflow at a negative scroll pos. */
      body { background: #54585c; display: flex; justify-content: safe center; align-items: flex-start;
             padding: 16px; box-sizing: border-box; min-height: 100vh; }
      #page { box-shadow: 0 1mm 5mm rgba(0, 0, 0, 0.45); }
    }
    /* ---- on print: true sheet size, no scaling, no backdrop ---- */
    @media print {
      body { background: #fff !important; padding: 0 !important; display: block !important; }
      #frame { transform: none !important; }
      #page { width: auto !important; height: auto !important; box-shadow: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var page = document.getElementById('page');
      if (!frame) return;
      var mmExact = function (px) { return (px * 25.4 / 96).toFixed(1); };

      // Match the print page to the chosen sheet so print/PDF agrees with the frame.
      var pageStyle = document.createElement('style');
      document.head.appendChild(pageStyle);
      pageStyle.textContent = '@page{size:' + mmExact(frame.offsetWidth) + 'mm ' + mmExact(frame.offsetHeight) + 'mm;margin:0;}';

      // Fit-to-screen ONCE on open (never up-scales). We deliberately do NOT re-fit on
      // resize: browser zoom fires resize, and re-fitting there would cancel the zoom.
      // After this initial fit, native browser zoom + scroll work normally on top of it.
      (function fitOnce() {
        var fw = frame.offsetWidth, fh = frame.offsetHeight, pad = 32;
        var scale = Math.min((window.innerWidth - pad) / fw, (window.innerHeight - pad) / fh, 1);
        frame.style.transformOrigin = 'top left';
        frame.style.transform = 'scale(' + scale + ')';
        if (page) { page.style.width = Math.ceil(fw * scale) + 'px'; page.style.height = Math.ceil(fh * scale) + 'px'; }
      })();
    })();
  </script>
